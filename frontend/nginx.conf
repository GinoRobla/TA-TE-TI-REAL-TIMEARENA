# Configuración de nginx para servir una Single Page App (SPA) como React.
# El problema de las SPA con nginx: si el usuario entra directo a /game,
# nginx busca un archivo llamado "game" → no lo encuentra → 404.
# La solución: redirigir todo a index.html y dejar que React Router maneje la ruta.

server {
    listen 80;                          # nginx escucha en el puerto 80
    root /usr/share/nginx/html;         # carpeta donde están los archivos de React
    index index.html;                   # archivo principal

    location / {
        # try_files: intentá servir:
        # 1. $uri        → el archivo exacto pedido (ej: /logo.png)
        # 2. $uri/       → como carpeta (ej: /assets/)
        # 3. /index.html → si no existe, mandá el index (React Router toma el control)
        try_files $uri $uri/ /index.html;
    }
}
